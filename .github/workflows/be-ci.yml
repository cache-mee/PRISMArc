name: BE-CI

on:
  push:
    branches: [develop, main]
    paths:
      - "B2B_BE/**"
      - ".github/workflows/be-ci.yml"
  pull_request:
    paths:
      - "B2B_BE/**"
      - ".github/workflows/be-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: B2B_BE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]" ruff black

      - name: Lint (ruff)
        run: ruff check app

      - name: Format check (black)
        run: black --check app

      - name: Run tests
        run: pytest
