server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: serve index.html for any route that doesn't match a
    # real static file, so client-side routing (chat / dashboard surfaces)
    # works on a hard refresh or deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
