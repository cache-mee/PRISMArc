[project]
name = "appointmentdotcom-backend"
version = "0.1.0"
description = "Agentic Appointment Management Engine — backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
